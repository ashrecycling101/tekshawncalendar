<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEKSHAWN CALENDAR</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fc-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-lg">
                    <i class="fa-solid fa-calendar-days text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight uppercase">TEKSHAWN CALENDAR</h1>
                    <p class="text-xs text-slate-400">Operations & Schedule Management</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3 flex-wrap justify-center">
                <button onclick="openReportModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-sm font-medium px-4 py-2 rounded-lg transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-file-excel text-emerald-400"></i> Reports & Export
                </button>
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-plus"></i> New Appointment
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <!-- Controls Bar -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                <button onclick="changeDate(-1)" class="p-2 border border-slate-200 rounded-lg hover:bg-slate-100 text-slate-600 transition">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h2 id="currentDateLabel" class="text-lg font-bold text-slate-800 min-w-[200px] text-center"></h2>
                <button onclick="changeDate(1)" class="p-2 border border-slate-200 rounded-lg hover:bg-slate-100 text-slate-600 transition">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button onclick="goToToday()" class="text-xs font-semibold uppercase tracking-wider text-blue-600 bg-blue-50 px-3 py-2 rounded-lg hover:bg-blue-100 transition">Today</button>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto justify-end flex-wrap">
                <!-- Search Filter -->
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="renderApp()" placeholder="Search customer, part #..." class="pl-9 pr-4 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-48 sm:w-64">
                </div>
                
                <!-- View Selector -->
                <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-sm font-medium">
                    <button onclick="setView('month')" id="btn-month" class="px-3 py-1.5 rounded-md transition bg-white text-blue-600 shadow-sm">Month</button>
                    <button onclick="setView('week')" id="btn-week" class="px-3 py-1.5 rounded-md transition text-slate-600 hover:text-slate-900">Week</button>
                    <button onclick="setView('day')" id="btn-day" class="px-3 py-1.5 rounded-md transition text-slate-600 hover:text-slate-900">Day</button>
                    <button onclick="setView('list')" id="btn-list" class="px-3 py-1.5 rounded-md transition text-slate-600 hover:text-slate-900">List</button>
                </div>
            </div>
        </div>

        <!-- Calendar Container -->
        <div id="calendarContainer" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <!-- Dynamically Rendered Views -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        TEKSHAWN CALENDAR &copy; 2026 &bull; Operations & Schedule Hub
    </footer>

    <!-- Add/Edit Appointment Modal -->
    <div id="appointmentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border border-slate-100">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">New Appointment</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <form id="appointmentForm" onsubmit="saveAppointment(event)" class="p-6 space-y-4">
                <input type="hidden" id="appointmentId">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Customer Name *</label>
                        <input type="text" id="custName" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Amanda Ives">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Part Number</label>
                        <input type="text" id="partNumber" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. QN207TAFKZA">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Date *</label>
                        <input type="date" id="apptDate" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Time From</label>
                        <input type="time" id="timeFrom" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Time To</label>
                        <input type="time" id="timeTo" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Status</label>
                        <select id="status" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Source</label>
                        <select id="source" onchange="checkSourceOther()" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="WorkMarket">WorkMarket</option>
                            <option value="Thumbtack">Thumbtack</option>
                            <option value="Barrister">Barrister</option>
                            <option value="Nextdoor">Nextdoor</option>
                            <option value="Google">Google</option>
                            <option value="Other">Other (Please specify)</option>
                        </select>
                    </div>
                </div>

                <div id="sourceOtherContainer" class="hidden">
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Specify Other Source</label>
                    <input type="text" id="sourceOther" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter source name">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Mobile</label>
                        <input type="text" id="mobile" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. (118) 774-6512">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Address</label>
                        <input type="text" id="address" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. 5221 cartwright ave 91601">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Remarks</label>
                    <textarea id="remarks" rows="2" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Notes or special instructions..."></textarea>
                </div>

                <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                    <button type="button" id="deleteBtn" onclick="deleteCurrentAppointment()" class="hidden text-rose-600 hover:text-rose-700 text-sm font-semibold flex items-center gap-1.5 px-3 py-2 rounded-lg hover:bg-rose-50 transition">
                        <i class="fa-solid fa-trash"></i> Delete
                    </button>
                    <div class="flex items-center gap-3 ml-auto">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-100 transition">Cancel</button>
                        <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold shadow-sm transition">Save Appointment</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Reports & Export Modal -->
    <div id="reportModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto border border-slate-100 flex flex-col">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-file-excel text-emerald-600"></i> Reports & Export Center
                </h3>
                <button onclick="closeReportModal()" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg hover:bg-slate-100 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="p-6 space-y-6 flex-grow">
                <!-- Filter Controls -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Report Period Type</label>
                        <select id="reportType" onchange="toggleReportPeriod()" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white focus:ring-2 focus:ring-blue-500">
                            <option value="month">By Month</option>
                            <option value="week">By Week</option>
                            <option value="custom">Custom Date Range</option>
                        </select>
                    </div>

                    <div id="reportMonthContainer">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Select Month</label>
                        <input type="month" id="reportMonthInput" onchange="generateReportPreview()" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div id="reportWeekContainer" class="hidden">
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Select Week Starting</label>
                        <input type="date" id="reportWeekInput" onchange="generateReportPreview()" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div id="reportCustomContainer" class="hidden sm:col-span-2 grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">From Date</label>
                            <input type="date" id="reportDateFrom" onchange="generateReportPreview()" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">To Date</label>
                            <input type="date" id="reportDateTo" onchange="generateReportPreview()" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg bg-white focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                </div>

                <!-- Summary Stats -->
                <div id="reportStats" class="flex gap-4 text-sm font-medium text-slate-600">
                    <!-- Populated dynamically -->
                </div>

                <!-- Preview Table -->
                <div class="border border-slate-200 rounded-xl overflow-hidden max-h-64 overflow-y-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead class="bg-slate-100 text-slate-700 sticky top-0">
                            <tr>
                                <th class="p-3 font-bold">Date & Time</th>
                                <th class="p-3 font-bold">Customer Name</th>
                                <th class="p-3 font-bold">Part Number</th>
                                <th class="p-3 font-bold">Status</th>
                                <th class="p-3 font-bold">Source</th>
                                <th class="p-3 font-bold">Mobile</th>
                                <th class="p-3 font-bold">Address</th>
                                <th class="p-3 font-bold">Remarks</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody" class="divide-y divide-slate-100 bg-white">
                            <!-- Rows -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <button onclick="closeReportModal()" class="px-4 py-2 border border-slate-200 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-100 transition">Close</button>
                <div class="flex items-center gap-3">
                    <button onclick="exportReportExcel()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold shadow-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-file-excel"></i> Export Excel / CSV
                    </button>
                    <button onclick="printReport()" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm font-semibold shadow-sm transition flex items-center gap-2">
                        <i class="fa-solid fa-print"></i> Print / PDF Summary
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Initial sample data seed matching user's PDF
        const defaultAppointments = [
            {
                id: "rec_1",
                custName: "LACN-CORPORATE",
                partNumber: "N/A",
                apptDate: "2026-11-02",
                timeFrom: "13:28",
                timeTo: "13:55",
                status: "Completed",
                source: "WorkMarket",
                mobile: "N/A",
                address: "541 W Colorado St #205 Glendale, CA",
                remarks: "Replace Nucleus Lock Tumbler Door 5 (2276064413)"
            },
            {
                id: "rec_2",
                custName: "Amanda Ives",
                partNumber: "QN207TAFKZA (Version F001)",
                apptDate: "2026-11-04",
                timeFrom: "09:00",
                timeTo: "10:00",
                status: "Pending",
                source: "Thumbtack",
                mobile: "(118) 774-6512",
                address: "5221 cartwright ave 91601",
                remarks: "waiting for parts parts link sent"
            },
            {
                id: "rec_3",
                custName: "Andrew Saldibar",
                partNumber: "Samsung 2005FXZA",
                apptDate: "2026-11-04",
                timeFrom: "12:00",
                timeTo: "15:00",
                status: "Completed",
                source: "Thumbtack",
                mobile: "(11)858-1995",
                address: "84-48 truston ave 90045 LA",
                remarks: "parts link sent"
            },
            {
                id: "rec_4",
                custName: "Mostafa Hedayat",
                partNumber: "Sony E-55883",
                apptDate: "2026-11-05",
                timeFrom: "12:00",
                timeTo: "15:00",
                status: "Completed",
                source: "WorkMarket",
                mobile: "(296) 369-4425",
                address: "1149 shady ridge id moorpark 93021",
                remarks: ""
            },
            {
                id: "rec_5",
                custName: "#449714",
                partNumber: "N55579",
                apptDate: "2026-11-05",
                timeFrom: "13:00",
                timeTo: "16:00",
                status: "Completed",
                source: "Other",
                sourceOther: "Keyma",
                mobile: "N/A",
                address: "Ralphs #723 101 W Los Angeles Ave Moorpark, CA, 93021",
                remarks: ""
            }
        ];

        let appointments = JSON.parse(localStorage.getItem('tekshawn_appointments')) || defaultAppointments;
        let currentView = 'month';
        let currentDate = new Date();

        function saveToStorage() {
            localStorage.setItem('tekshawn_appointments', JSON.stringify(appointments));
        }

        // Navigation
        function changeDate(dir) {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + dir);
            } else if (currentView === 'week') {
                currentDate.setDate(currentDate.getDate() + (dir * 7));
            } else if (currentView === 'day' || currentView === 'list') {
                currentDate.setDate(currentDate.getDate() + dir);
            }
            renderApp();
        }

        function goToToday() {
            currentDate = new Date();
            renderApp();
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('[id^="btn-"]').forEach(btn => {
                btn.className = "px-3 py-1.5 rounded-md transition text-slate-600 hover:text-slate-900";
            });
            document.getElementById(`btn-${view}`).className = "px-3 py-1.5 rounded-md transition bg-white text-blue-600 shadow-sm";
            renderApp();
        }

        function renderApp() {
            updateHeaderLabel();
            const container = document.getElementById('calendarContainer');
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = appointments.filter(app => {
                const textMatch = (app.custName && app.custName.toLowerCase().includes(searchQuery)) ||
                                  (app.partNumber && app.partNumber.toLowerCase().includes(searchQuery)) ||
                                  (app.address && app.address.toLowerCase().includes(searchQuery)) ||
                                  (app.source && app.source.toLowerCase().includes(searchQuery));
                return textMatch;
            });

            if (currentView === 'month') {
                renderMonthView(container, filtered);
            } else if (currentView === 'week') {
                renderWeekView(container, filtered);
            } else if (currentView === 'day') {
                renderDayView(container, filtered);
            } else if (currentView === 'list') {
                renderListView(container, filtered);
            }
        }

        function updateHeaderLabel() {
            const label = document.getElementById('currentDateLabel');
            const options = { month: 'long', year: 'numeric' };
            if (currentView === 'month') {
                label.innerText = currentDate.toLocaleDateString('en-US', options);
            } else if (currentView === 'week') {
                const start = new Date(currentDate);
                start.setDate(start.getDate() - start.getDay());
                const end = new Date(start);
                end.setDate(end.getDate() + 6);
                label.innerText = `${start.toLocaleDateString('en-US', {month:'short', day:'numeric'})} - ${end.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'})}`;
            } else {
                label.innerText = currentDate.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
            }
        }

        // Render Month Grid
        function renderMonthView(container, items) {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startingDayOfWeek = firstDay.getDay();
            const totalDays = lastDay.getDate();

            let html = `<div class="fc-grid bg-slate-200 gap-px text-xs font-bold text-slate-600 text-center py-2 bg-slate-100 border-b border-slate-200">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>`;

            html += `<div class="fc-grid bg-slate-200 gap-px auto-rows-fr bg-slate-200">`;

            // Blank slots for previous month
            for (let i = 0; i < startingDayOfWeek; i++) {
                html += `<div class="bg-slate-50/50 min-h-[110px] p-2 text-slate-300"></div>`;
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayItems = items.filter(i => i.apptDate === dateStr);
                const isToday = new Date().toISOString().split('T')[0] === dateStr;

                html += `<div class="bg-white min-h-[110px] p-2 flex flex-col hover:bg-slate-50 transition overflow-hidden">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-semibold ${isToday ? 'bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center' : 'text-slate-700'}">${day}</span>
                        <button onclick="openModalForDate('${dateStr}')" class="text-slate-400 hover:text-blue-600 text-xs"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div class="space-y-1 overflow-y-auto max-h-[90px] flex-grow">`;

                dayItems.forEach(item => {
                    const statusColor = item.status === 'Completed' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                                        item.status === 'In Progress' ? 'bg-amber-50 text-amber-700 border-amber-200' :
                                        item.status === 'Cancelled' ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-blue-50 text-blue-700 border-blue-200';
                    const srcLabel = item.source === 'Other' && item.sourceOther ? item.sourceOther : item.source;
                    html += `<div onclick="openModalForEdit('${item.id}')" class="text-[11px] p-1.5 rounded border ${statusColor} cursor-pointer truncate shadow-sm hover:shadow transition">
                        <div class="font-bold truncate">${item.custName}</div>
                        <div class="text-[10px] opacity-80 flex justify-between"><span>${item.timeFrom || ''}</span><span class="font-semibold">${srcLabel || ''}</span></div>
                    </div>`;
                });

                html += `</div></div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // Render Week View
        function renderWeekView(container, items) {
            const start = new Date(currentDate);
            start.setDate(start.getDate() - start.getDay());
            
            let html = `<div class="grid grid-cols-7 divide-x divide-slate-200 bg-slate-100 text-xs font-bold text-slate-700 text-center py-2 border-b border-slate-200">`;
            for (let i = 0; i < 7; i++) {
                const d = new Date(start);
                d.setDate(d.getDate() + i);
                html += `<div>${d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'})}</div>`;
            }
            html += `</div><div class="grid grid-cols-7 divide-x divide-slate-200 min-h-[500px] bg-slate-50">`;

            for (let i = 0; i < 7; i++) {
                const d = new Date(start);
                d.setDate(d.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];
                const dayItems = items.filter(item => item.apptDate === dateStr);

                html += `<div class="bg-white p-2 flex flex-col">
                    <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-100">
                        <span class="text-xs font-bold text-slate-600">${d.getDate()}</span>
                        <button onclick="openModalForDate('${dateStr}')" class="text-slate-400 hover:text-blue-600 text-xs"><i class="fa-solid fa-plus"></i></button>
                    </div>
                    <div class="space-y-2 overflow-y-auto flex-grow">`;
                
                dayItems.forEach(item => {
                    const statusColor = item.status === 'Completed' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-blue-50 text-blue-700 border-blue-200';
                    const srcLabel = item.source === 'Other' && item.sourceOther ? item.sourceOther : item.source;
                    html += `<div onclick="openModalForEdit('${item.id}')" class="text-xs p-2 rounded border ${statusColor} cursor-pointer shadow-sm hover:shadow transition">
                        <div class="font-bold">${item.custName}</div>
                        <div class="text-[11px] opacity-90">${item.timeFrom || ''} - ${item.timeTo || ''}</div>
                        <div class="text-[10px] font-semibold mt-1 bg-white/60 px-1 py-0.5 rounded w-fit">${srcLabel || ''}</div>
                    </div>`;
                });
                html += `</div></div>`;
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        // Render Day View
        function renderDayView(container, items) {
            const dateStr = currentDate.toISOString().split('T')[0];
            const dayItems = items.filter(item => item.apptDate === dateStr);

            let html = `<div class="p-6 bg-white min-h-[450px]">
                <div class="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                    <h3 class="text-lg font-bold text-slate-800">${currentDate.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'})}</h3>
                    <button onclick="openModalForDate('${dateStr}')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition flex items-center gap-1.5 shadow-sm"><i class="fa-solid fa-plus"></i> Add Appointment</button>
                </div>
                <div class="space-y-3">`;

            if (dayItems.length === 0) {
                html += `<div class="text-center py-16 text-slate-400 text-sm">No appointments scheduled for this day.</div>`;
            } else {
                dayItems.forEach(item => {
                    const srcLabel = item.source === 'Other' && item.sourceOther ? item.sourceOther : item.source;
                    html += `<div onclick="openModalForEdit('${item.id}')" class="p-4 rounded-xl border border-slate-200 hover:border-blue-300 bg-slate-50/50 hover:bg-white transition cursor-pointer flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-sm">
                        <div class="space-y-1">
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-slate-900 text-base">${item.custName}</span>
                                <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold ${item.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}">${item.status}</span>
                                <span class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full font-medium">${srcLabel}</span>
                            </div>
                            <div class="text-xs text-slate-500 flex items-center gap-4 flex-wrap">
                                <span class="font-medium text-slate-700"><i class="fa-regular fa-clock mr-1 text-blue-600"></i> ${item.timeFrom || 'N/A'} - ${item.timeTo || 'N/A'}</span>
                                <span><i class="fa-solid fa-barcode mr-1 text-slate-400"></i> Part: ${item.partNumber || 'N/A'}</span>
                                <span><i class="fa-solid fa-phone mr-1 text-slate-400"></i> ${item.mobile || 'N/A'}</span>
                                <span><i class="fa-solid fa-location-dot mr-1 text-slate-400"></i> ${item.address || 'N/A'}</span>
                            </div>
                            ${item.remarks ? `<div class="text-xs text-slate-600 italic bg-white p-2 rounded border border-slate-100 mt-2">Remarks: ${item.remarks}</div>` : ''}
                        </div>
                    </div>`;
                });
            }
            html += `</div></div>`;
            container.innerHTML = html;
        }

        // Render List View
        function renderListView(container, items) {
            let html = `<div class="overflow-x-auto"><table class="w-full text-left border-collapse text-xs">
                <thead class="bg-slate-100 text-slate-700 border-b border-slate-200">
                    <tr>
                        <th class="p-3 font-bold">Date & Time</th>
                        <th class="p-3 font-bold">Customer Name</th>
                        <th class="p-3 font-bold">Part Number</th>
                        <th class="p-3 font-bold">Status</th>
                        <th class="p-3 font-bold">Source</th>
                        <th class="p-3 font-bold">Mobile</th>
                        <th class="p-3 font-bold">Address</th>
                        <th class="p-3 font-bold">Remarks</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 bg-white">`;

            if (items.length === 0) {
                html += `<tr><td colspan="8" class="p-8 text-center text-slate-400">No records found.</td></tr>`;
            } else {
                items.sort((a,b) => new Date(a.apptDate) - new Date(b.apptDate)).forEach(item => {
                    const srcLabel = item.source === 'Other' && item.sourceOther ? item.sourceOther : item.source;
                    html += `<tr onclick="openModalForEdit('${item.id}')" class="hover:bg-slate-50 cursor-pointer transition">
                        <td class="p-3 font-medium text-slate-700">${item.apptDate}<br><span class="text-[10px] text-slate-400">${item.timeFrom || ''} - ${item.timeTo || ''}</span></td>
                        <td class="p-3 font-bold text-slate-900">${item.custName}</td>
                        <td class="p-3 text-slate-600">${item.partNumber || 'N/A'}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded-full font-semibold text-[10px] ${item.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}">${item.status}</span></td>
                        <td class="p-3 font-medium text-slate-700">${srcLabel || ''}</td>
                        <td class="p-3 text-slate-600">${item.mobile || 'N/A'}</td>
                        <td class="p-3 text-slate-600">${item.address || 'N/A'}</td>
                        <td class="p-3 text-slate-500 truncate max-w-xs">${item.remarks || ''}</td>
                    </tr>`;
                });
            }
            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        // Modal Handlers
        function openModal() {
            document.getElementById('modalTitle').innerText = "New Appointment";
            document.getElementById('appointmentForm').reset();
            document.getElementById('appointmentId').value = "";
            document.getElementById('apptDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('deleteBtn').classList.add('hidden');
            document.getElementById('sourceOtherContainer').classList.add('hidden');
            document.getElementById('appointmentModal').classList.remove('hidden');
        }

        function openModalForDate(dateStr) {
            openModal();
            document.getElementById('apptDate').value = dateStr;
        }

        function openModalForEdit(id) {
            const item = appointments.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modalTitle').innerText = "Edit Appointment";
            document.getElementById('appointmentId').value = item.id;
            document.getElementById('custName').value = item.custName || "";
            document.getElementById('partNumber').value = item.partNumber || "";
            document.getElementById('apptDate').value = item.apptDate || "";
            document.getElementById('timeFrom').value = item.timeFrom || "";
            document.getElementById('timeTo').value = item.timeTo || "";
            document.getElementById('status').value = item.status || "Pending";
            document.getElementById('source').value = item.source || "WorkMarket";
            
            checkSourceOther();
            if (item.source === 'Other') {
                document.getElementById('sourceOther').value = item.sourceOther || "";
            }

            document.getElementById('mobile').value = item.mobile || "";
            document.getElementById('address').value = item.address || "";
            document.getElementById('remarks').value = item.remarks || "";
            
            document.getElementById('deleteBtn').classList.remove('hidden');
            document.getElementById('appointmentModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('appointmentModal').classList.add('hidden');
        }

        function checkSourceOther() {
            const src = document.getElementById('source').value;
            const container = document.getElementById('sourceOtherContainer');
            if (src === 'Other') {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
            }
        }

        function saveAppointment(e) {
            e.preventDefault();
            const id = document.getElementById('appointmentId').value;
            const sourceVal = document.getElementById('source').value;
            
            const data = {
                id: id || 'rec_' + Date.now(),
                custName: document.getElementById('custName').value,
                partNumber: document.getElementById('partNumber').value,
                apptDate: document.getElementById('apptDate').value,
                timeFrom: document.getElementById('timeFrom').value,
                timeTo: document.getElementById('timeTo').value,
                status: document.getElementById('status').value,
                source: sourceVal,
                sourceOther: sourceVal === 'Other' ? document.getElementById('sourceOther').value : '',
                mobile: document.getElementById('mobile').value,
                address: document.getElementById('address').value,
                remarks: document.getElementById('remarks').value
            };

            if (id) {
                const index = appointments.findIndex(i => i.id === id);
                if (index !== -1) appointments[index] = data;
            } else {
                appointments.push(data);
            }

            saveToStorage();
            closeModal();
            renderApp();
        }

        function deleteCurrentAppointment() {
            const id = document.getElementById('appointmentId').value;
            if (id && confirm("Are you sure you want to delete this appointment?")) {
                appointments = appointments.filter(i => i.id !== id);
                saveToStorage();
                closeModal();
                renderApp();
            }
        }

        // Reports Center
        let currentReportFilteredItems = [];

        function openReportModal() {
            const now = new Date();
            document.getElementById('reportMonthInput').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const firstDayOfWeek = new Date(now);
            firstDayOfWeek.setDate(now.getDate() - now.getDay());
            document.getElementById('reportWeekInput').value = firstDayOfWeek.toISOString().split('T')[0];
            document.getElementById('reportDateFrom').value = now.toISOString().split('T')[0];
            document.getElementById('reportDateTo').value = now.toISOString().split('T')[0];
            
            toggleReportPeriod();
            document.getElementById('reportModal').classList.remove('hidden');
        }

        function closeReportModal() {
            document.getElementById('reportModal').classList.add('hidden');
        }

        function toggleReportPeriod() {
            const type = document.getElementById('reportType').value;
            document.getElementById('reportMonthContainer').classList.toggle('hidden', type !== 'month');
            document.getElementById('reportWeekContainer').classList.toggle('hidden', type !== 'week');
            document.getElementById('reportCustomContainer').classList.toggle('hidden', type !== 'custom');
            generateReportPreview();
        }

        function generateReportPreview() {
            const type = document.getElementById('reportType').value;
            let startDate = '', endDate = '';

            if (type === 'month') {
                const val = document.getElementById('reportMonthInput').value;
                if (!val) return;
                const [y, m] = val.split('-');
                startDate = `${y}-${m}-01`;
                const lastD = new Date(y, m, 0).getDate();
                endDate = `${y}-${m}-${lastD}`;
            } else if (type === 'week') {
                const val = document.getElementById('reportWeekInput').value;
                if (!val) return;
                const start = new Date(val);
                const end = new Date(start);
                end.setDate(end.getDate() + 6);
                startDate = start.toISOString().split('T')[0];
                endDate = end.toISOString().split('T')[0];
            } else if (type === 'custom') {
                startDate = document.getElementById('reportDateFrom').value;
                endDate = document.getElementById('reportDateTo').value;
                if (!startDate || !endDate) return;
            }

            currentReportFilteredItems = appointments.filter(item => {
                return item.apptDate >= startDate && item.apptDate <= endDate;
            });

            // Stats
            const total = currentReportFilteredItems.length;
            const completed = currentReportFilteredItems.filter(i => i.status === 'Completed').length;
            const pending = currentReportFilteredItems.filter(i => i.status === 'Pending').length;

            document.getElementById('reportStats').innerHTML = `
                <div class="bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100 text-blue-900">Total Records: <strong class="font-bold">${total}</strong></div>
                <div class="bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-100 text-emerald-900">Completed: <strong class="font-bold">${completed}</strong></div>
                <div class="bg-amber-50 px-3 py-1.5 rounded-lg border border-amber-100 text-amber-900">Pending: <strong class="font-bold">${pending}</strong></div>
            `;

            // Table Preview
            const tbody = document.getElementById('reportTableBody');
            let html = '';
            if (currentReportFilteredItems.length === 0) {
                html = `<tr><td colspan="8" class="p-6 text-center text-slate-400">No records found for the selected date range.</td></tr>`;
            } else {
                currentReportFilteredItems.sort((a,b) => new Date(a.apptDate) - new Date(b.apptDate)).forEach(item => {
                    const srcLabel = item.source === 'Other' && item.sourceOther ? item.sourceOther : item.source;
                    html += `<tr>
                        <td class="p-3">${item.apptDate}<br><span class="text-[10px] text-slate-400">${item.timeFrom || ''} - ${item.timeTo || ''}</span></td>
                        <td class="p-3 font-bold">${item.custName}</td>
                        <td class="p-3">${item.partNumber || 'N/A'}</td>
                        <td class="p-3"><span class="px-2 py-0.5 rounded-full font-semibold text-[10px] ${item.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}">${item.status}</span></td>
                        <td class="p-3">${srcLabel || ''}</td>
                        <td class="p-3">${item.mobile || 'N/A'}</td>
                        <td class="p-3">${item.address || 'N/A'}</td>
                        <td class="p-3 text-slate-500">${item.remarks || ''}</td>
                    </tr>`;
                });
            }
            tbody.innerHTML = html;
        }

        function exportReportExcel() {
            if (currentReportFilteredItems.length === 0) {
                alert("No records to export for this date range.");
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Date,Time From,Time To,Customer Name,Part Number,Status,Source,Mobile,Address,Remarks\r\n";

            currentReportFilteredItems.forEach(item => {
                const srcLabel = item.source === 'Other' && item.sourceOther ? item.sourceOther : item.source;
                const row = [
                    item.apptDate,
                    item.timeFrom || '',
                    item.timeTo || '',
                    `"${(item.custName || '').replace(/"/g, '""')}"`,
                    `"${(item.partNumber || '').replace(/"/g, '""')}"`,
                    item.status || '',
                    `"${(srcLabel || '').replace(/"/g, '""')}"`,
                    `"${(item.mobile || '').replace(/"/g, '""')}"`,
                    `"${(item.address || '').replace(/"/g, '""')}"`,
                    `"${(item.remarks || '').replace(/"/g, '""')}"`
                ];
                csvContent += row.join(",") + "\r\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Tekshawn_Calendar_Report_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function printReport() {
            window.print();
        }

        // Initial Render
        renderApp();
    </script>
</body>
</html>
